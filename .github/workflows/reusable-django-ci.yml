# Reusable workflow appelé par chaque app Django via :
#
#   jobs:
#     ci:
#       uses: satkaar/platform/.github/workflows/reusable-django-ci.yml@main
#       with:
#         python-version: "3.12"
#
# Pré-requis côté repo platform :
#   Settings → Actions → General → Access → "Accessible from repositories
#   owned by 'satkaar'" (sinon les apps ne peuvent pas réutiliser ce workflow).
#
# Pré-requis côté app appelante : aucun secret (CI tourne en sandbox).
#
# Postgres 16 en service container pour matcher la prod (RDB Scaleway).

name: Django CI (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Version Python à installer (default 3.12).
        type: string
        required: false
        default: "3.12"
      run-makemigrations-check:
        description: Vérifie que les migrations sont à jour avec les models.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  django:
    name: Django check + tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # SECRET_KEY requis pour `manage.py check` côté CRM (settings fait
      # _required_env). Fixé sur run_id pour ne JAMAIS coïncider avec la prod.
      DJANGO_SECRET_KEY: "ci-not-secret-${{ github.run_id }}"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_test"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        env:
          AGENDA_DEPLOY_KEY: ${{ secrets.AGENDA_DEPLOY_KEY }}
          MAIRIE_DEPLOY_KEY: ${{ secrets.MAIRIE_DEPLOY_KEY }}
        run: |
          python -m pip install --upgrade pip
          # Deploy keys SSH pour les deps sur repos GitHub privés. Une deploy key
          # = 1 repo, donc une clé par repo, sélectionnée via un alias d'hôte SSH
          # (~/.ssh/config). Clé absente → bloc sauté (apps sans dep privée).
          #   - agenda : Host github.com (URL requirements inchangée)
          #   - mairie : Host github-mairie → requirements pointe sur git@github-mairie
          mkdir -p -m 0700 ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$AGENDA_DEPLOY_KEY" ]; then
            printf '%s\n' "$AGENDA_DEPLOY_KEY" > ~/.ssh/id_agenda
            chmod 600 ~/.ssh/id_agenda
            printf 'Host github.com\n  IdentityFile ~/.ssh/id_agenda\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          fi
          if [ -n "$MAIRIE_DEPLOY_KEY" ]; then
            printf '%s\n' "$MAIRIE_DEPLOY_KEY" > ~/.ssh/id_mairie
            chmod 600 ~/.ssh/id_mairie
            printf 'Host github-mairie\n  HostName github.com\n  IdentityFile ~/.ssh/id_mairie\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          fi
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: makemigrations --check (drift schéma ↔ models)
        if: ${{ inputs.run-makemigrations-check }}
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # On bloque sur les vrais problèmes (errors) mais on tolère les
          # warnings dont les fixes habituels (pin apt/pip à la version exacte
          # → DL3008/DL3013) cassent les builds au moindre patch Debian.
          failure-threshold: warning
          ignore: DL3008,DL3013
          no-fail: false
