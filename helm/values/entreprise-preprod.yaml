# Preprod values — namespace `entreprise-preprod` (DB + secrets provisionnés
# par Terraform avec le suffixe `-preprod`). Surcharge image, host, et taille.

nameOverride: entreprise
fullnameOverride: entreprise

image:
  repository: rg.fr-par.scw.cloud/mairie-agglo-platform/entreprise
  tag: preprod-latest

replicaCount: 1

ingress:
  host: preprod.entreprise.satkaar.io

env:
  DEBUG: "False"
  ALLOWED_HOSTS: "preprod.entreprise.satkaar.io"
  GUNICORN_WORKERS: "2"
  PORT: "8080"

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi
