# Runner WhatsApp (Baileys) du CRM — 3ème release Helm sur le MÊME chart
# django-app et la MÊME image. Dispatch via RUN_MODE=wa-runner
# dans entrypoint.sh (qui exec entrypoint-wa-runner.sh).

nameOverride: crm-wa-runner
fullnameOverride: crm-wa-runner

image:
  repository: rg.fr-par.scw.cloud/mairie-agglo-platform/crm-mairie-agglo
  tag: latest

replicaCount: 1

strategy:
  type: Recreate

service:
  enabled: false

ingress:
  enabled: false

env:
  RUN_MODE: "wa-runner"
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  PORT: "8081"

envFromSecretRefs:
  - name: crm-secrets

probes:
  liveness:
    enabled: true
    tcp: false
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
  readiness:
    enabled: true
    tcp: false
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi
