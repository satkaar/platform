nameOverride: satkaar-site
fullnameOverride: satkaar-site

image:
  repository: rg.fr-par.scw.cloud/mairie-agglo-platform/satkaar-site
  tag: preprod-latest

# Nouveau site (vitrine + espace client, mail, agenda, contacts) : ses données doivent
# survivre aux déploiements. SQLite et fichiers privés sur un volume persistant /data.
# Un seul pod (volume ReadWriteOnce) → stratégie Recreate.
replicaCount: 1
strategy:
  type: Recreate

persistence:
  enabled: true
  size: 5Gi
  mountPath: /data

# L'image tourne en uid/gid 1001 : le volume doit lui être accessible en écriture.
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

ingress:
  host: preprod.satkaar.io

env:
  DEBUG: "False"
  ALLOWED_HOSTS: "preprod.satkaar.io"
  SITE_URL: "https://preprod.satkaar.io"
  GUNICORN_WORKERS: "2"
  PORT: "8080"
  DJANGO_DB_PATH: "/data/db.sqlite3"
  ESPACE_DOCUMENTS_ROOT: "/data/documents_prives"
  # Préproduction : invisible pour les moteurs de recherche (robots.txt + X-Robots-Tag).
  DJANGO_NOINDEX: "true"

# Pas de Postgres : pas de DATABASE_URL.
envFromSecrets: null

# DJANGO_SECRET_KEY (valeur preprod distincte) ; facultatifs : COURRIEL_CLE,
# ANTHROPIC_API_KEY, EMAIL_HOST_PASSWORD (voir DEPLOIEMENT.md du dépôt satkaar-site).
#   kubectl -n satkaar-site-preprod create secret generic satkaar-site-secrets \
#     --from-literal=DJANGO_SECRET_KEY=$(openssl rand -hex 32)
envFromSecretRefs:
  - name: satkaar-site-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
