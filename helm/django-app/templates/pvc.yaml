{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "django-app.fullname" . }}-data
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
  annotations:
    # On conserve le PVC (et donc les données) même si la release Helm est
    # désinstallée — garde-fou contre une perte de données SQLite accidentelle.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
